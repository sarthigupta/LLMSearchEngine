version: '3.8'

services:
  llmengine:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3.8-27b}
      - LLM_RPM_LIMIT=${LLM_RPM_LIMIT:-10}
      - MAX_PAGES_PER_WORKFLOW=15
      - MAX_RESULTS_PER_WORKFLOW=30
      - FETCH_CONCURRENCY=5
      - MONGODB_URI=${MONGODB_URI}
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    command: >
      sh -c '
      mkdir -p /etc/searxng &&
      echo "search:\n  formats:\n    - html\n    - json" > /etc/searxng/settings.yml &&
      /usr/local/searxng/dockerfiles/docker-entrypoint.sh
      '

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataIntel | AI Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0A0A0A] text-[#EDEDED] font-['Inter'] min-h-screen flex flex-col antialiased selection:bg-indigo-500/30" x-data="app()" x-init="init()">
    
    <!-- Minimalist Header -->
    <header class="fixed top-0 w-full z-50 bg-[#0A0A0A]/80 backdrop-blur-md border-b border-[#222]">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 group cursor-pointer">
                <div class="w-5 h-5 rounded-sm bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.5)] transition-all duration-300 group-hover:shadow-[0_0_25px_rgba(99,102,241,0.8)]">
                    <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-sm font-semibold tracking-wide text-white/90">DataIntel</h1>
            </div>
            <div class="flex items-center gap-4">
                <button @click="showHistory = true" class="text-xs font-medium text-[#888] hover:text-white transition-colors bg-[#1A1A1A] px-3 py-1.5 rounded-md border border-[#333] hover:border-[#555] flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    History
                </button>
                <div class="text-xs font-medium text-[#888] flex items-center gap-2 bg-[#1A1A1A] px-3 py-1.5 rounded-full border border-[#333]">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                    System Online
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-6 pt-32 pb-20 flex-grow flex flex-col gap-12">
        
        <!-- Input Section -->
        <section class="flex flex-col gap-4 fade-in">
            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500/20 to-purple-500/20 rounded-xl blur opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative bg-[#111] border border-[#333] rounded-xl overflow-hidden focus-within:border-indigo-500/50 transition-colors duration-300 shadow-2xl">
                    <textarea 
                        x-model="prompt" 
                        class="w-full bg-transparent p-5 text-sm md:text-base text-white/90 placeholder:text-[#555] focus:outline-none resize-none min-h-[120px]" 
                        placeholder="Describe what data you want to extract... e.g., Find AI/ML internships in India posted in the last 7 days."
                    ></textarea>
                    <div class="flex items-center justify-between p-3 border-t border-[#222] bg-[#0d0d0d]">
                        <div class="text-xs text-[#555] flex items-center gap-1.5 px-2">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            AI Agent will analyze and plan the extraction
                        </div>
                        <button 
                            @click="submitWorkflow()" 
                            :disabled="loading || !prompt.trim()" 
                            class="relative overflow-hidden group bg-white text-black px-5 py-1.5 rounded-lg text-sm font-medium transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-200 hover:shadow-[0_0_20px_rgba(255,255,255,0.15)] flex items-center gap-2"
                        >
                            <span x-show="!loading" class="flex items-center gap-2">
                                Execute <svg class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </span>
                            <span x-show="loading" class="flex items-center gap-2">
                                <svg class="animate-spin w-3.5 h-3.5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Running...
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Status Section -->
        <section x-show="currentWorkflowId" class="slide-up">
            <div class="bg-[#111] border border-[#222] rounded-xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-medium text-white/80 flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full" :class="status === 'completed' ? 'bg-green-500' : (status === 'failed' ? 'bg-red-500' : 'bg-indigo-500 animate-pulse')"></div>
                        <span x-text="status.charAt(0).toUpperCase() + status.slice(1)"></span>
                    </h3>
                    <span class="text-xs font-mono text-[#888]" x-text="progress + '%'"></span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-[#222] rounded-full h-1 mb-8 overflow-hidden">
                    <div class="h-1 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-700 ease-out relative" :style="'width: ' + progress + '%'">
                        <div class="absolute top-0 right-0 bottom-0 left-0 bg-[linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent)] animate-[shimmer_2s_infinite]"></div>
                    </div>
                </div>

                <!-- Terminal-like Logs -->
                <div class="relative bg-[#050505] rounded-lg border border-[#222] p-4 group">
                    <div class="absolute top-0 right-0 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <div class="text-[10px] uppercase tracking-widest text-[#555]">System Logs</div>
                    </div>
                    <div class="text-xs font-mono text-[#888] h-32 overflow-y-auto flex flex-col-reverse custom-scrollbar">
                        <template x-for="log in logs">
                            <div class="py-1 border-b border-[#111] last:border-0 hover:text-[#ccc] transition-colors">
                                <span class="text-[#444]" x-text="'> '"></span>
                                <span x-text="log"></span>
                            </div>
                        </template>
                        <div x-show="logs.length === 0" class="text-[#444] italic">Awaiting execution...</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section x-show="records.length > 0" class="slide-up">
            <div class="flex items-center justify-between mb-4 px-2 flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <h3 class="text-sm font-medium text-white/90">Extraction Results</h3>
                    <span class="text-xs text-[#888] bg-[#1A1A1A] px-2 py-0.5 rounded-full border border-[#333]" x-text="filteredRecords.length + (filteredRecords.length !== records.length ? (' / ' + records.length) : '') + ' records'"></span>
                </div>
                
                <div class="flex items-center gap-3 flex-grow md:flex-grow-0 justify-end">
                    <div class="relative group w-full md:w-64">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-3.5 h-3.5 text-[#555] group-focus-within:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input x-model="searchQuery" type="text" placeholder="Search results..." class="w-full bg-[#1A1A1A] text-sm text-white border border-[#333] focus:border-indigo-500/50 rounded-md pl-9 pr-3 py-1.5 focus:outline-none transition-colors placeholder:text-[#555]">
                    </div>
                    <button @click="exportCSV()" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors bg-[#1A1A1A] hover:bg-[#222] px-3 py-1.5 rounded-md border border-[#333] hover:border-indigo-500/30 flex items-center gap-1.5 whitespace-nowrap">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export CSV
                    </button>
                </div>
            </div>
            
            <div class="bg-[#111] border border-[#222] rounded-xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-[#151515] text-[#777] text-xs font-medium border-b border-[#222]">
                            <tr>
                                <template x-for="col in columns">
                                    <th class="px-4 py-3 font-medium" x-text="col"></th>
                                </template>
                                <th class="px-4 py-3 font-medium text-right">Confidence</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-[#222]">
                            <template x-for="rec in filteredRecords" :key="rec.id">
                                <tr class="hover:bg-[#1A1A1A] cursor-pointer transition-colors group" @click="inspect(rec)">
                                    <template x-for="col in columns">
                                        <td class="px-4 py-3 text-[#CCC] max-w-[200px] truncate group-hover:text-white transition-colors" x-text="rec.data[col] || '-'"></td>
                                    </template>
                                    <td class="px-4 py-3 text-right">
                                        <div class="inline-flex items-center gap-1.5">
                                            <div class="w-1.5 h-1.5 rounded-full" :class="rec.confidence >= 0.8 ? 'bg-green-500' : 'bg-yellow-500'"></div>
                                            <span class="text-xs text-[#888]" x-text="(rec.confidence * 100).toFixed(0) + '%'"></span>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Minimalist Inspector Modal -->
    <div x-show="inspectedRecord" 
         class="fixed inset-0 z-[100] flex justify-end" 
         style="display: none;" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="inspectedRecord = null">
         
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        
        <div class="relative w-full max-w-md bg-[#0A0A0A] h-full border-l border-[#222] shadow-2xl flex flex-col" 
             @click.stop
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="translate-x-full">
            
            <div class="p-6 border-b border-[#222] flex justify-between items-center bg-[#111]">
                <h3 class="text-sm font-medium text-white">Record Details</h3>
                <button @click="inspectedRecord = null" class="text-[#666] hover:text-white transition-colors p-1 bg-[#1A1A1A] rounded-md border border-[#333]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar flex-grow">
                <template x-if="inspectedRecord">
                    <div class="space-y-8">
                        <div class="space-y-4">
                            <template x-for="(val, key) in inspectedRecord.data">
                                <div class="bg-[#111] p-3 rounded-lg border border-[#222]">
                                    <div class="text-[10px] text-[#666] uppercase tracking-wider mb-1" x-text="key"></div>
                                    <div class="text-sm text-[#DDD] whitespace-pre-wrap font-medium" x-text="val || '-'"></div>
                                </div>
                            </template>
                        </div>
                        
                        <div>
                            <div class="text-xs font-medium text-[#888] mb-3 flex items-center gap-2">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                Evidence & Sources
                            </div>
                            <template x-for="src in inspectedSources">
                                <div class="bg-[#111] p-4 rounded-lg border border-[#222] relative overflow-hidden group">
                                    <div class="absolute left-0 top-0 bottom-0 w-0.5 bg-indigo-500/50"></div>
                                    <a :href="src.url" target="_blank" class="text-indigo-400 hover:text-indigo-300 transition-colors text-xs truncate block mb-3 opacity-80 group-hover:opacity-100" x-text="src.url"></a>
                                    <div class="text-sm text-[#AAA] italic leading-relaxed" x-text="`&quot;${src.evidence_snippet || 'Evidence data unavailable.'}&quot;`"></div>
                                </div>
                            </template>
                            <div x-show="!inspectedSources || inspectedSources.length === 0" class="text-xs text-[#555] italic p-4 bg-[#111] rounded-lg border border-[#222]">
                                No sources available for this record.
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div x-show="showHistory" 
         class="fixed inset-0 z-[100] flex justify-start" 
         style="display: none;" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="showHistory = false">
         
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        
        <div class="relative w-full max-w-sm bg-[#0A0A0A] h-full border-r border-[#222] shadow-2xl flex flex-col" 
             @click.stop
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="-translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="-translate-x-full">
            
            <div class="p-5 border-b border-[#222] flex justify-between items-center bg-[#111]">
                <h3 class="text-sm font-medium text-white flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Previous Workflows
                </h3>
                <button @click="showHistory = false" class="text-[#666] hover:text-white transition-colors p-1 bg-[#1A1A1A] rounded-md border border-[#333]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto custom-scrollbar flex-grow space-y-3">
                <template x-for="wf in history">
                    <div @click="loadWorkflow(wf)" class="bg-[#111] border border-[#222] hover:border-indigo-500/50 p-4 rounded-xl cursor-pointer transition-colors group">
                        <div class="flex items-center justify-between mb-2">
                            <div class="w-2 h-2 rounded-full" :class="wf.status === 'completed' ? 'bg-green-500' : (wf.status === 'failed' ? 'bg-red-500' : 'bg-indigo-500')"></div>
                            <span class="text-[10px] text-[#555] uppercase font-mono" x-text="new Date(wf.created_at).toLocaleDateString()"></span>
                        </div>
                        <p class="text-xs text-[#DDD] line-clamp-2 group-hover:text-white transition-colors" x-text="wf.prompt"></p>
                    </div>
                </template>
                <div x-show="history.length === 0" class="text-xs text-[#555] text-center p-6 italic border border-dashed border-[#222] rounded-xl">
                    No past searches found.
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

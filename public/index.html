<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Data Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col" x-data="app()" x-init="init()">
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                DataIntel
            </h1>
        </div>
    </header>

    <main class="container mx-auto p-4 py-8 max-w-6xl flex-grow">
        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8 shadow-md">
            <h2 class="text-xl font-bold mb-4">New Request</h2>
            <textarea x-model="prompt" class="w-full bg-gray-900 border border-gray-700 rounded p-4 text-white focus:outline-none focus:border-indigo-500 mb-4" rows="3" placeholder="e.g. Find AI/ML internships in India posted in the last 7 days"></textarea>
            <div class="flex items-center gap-4">
                <button @click="submitWorkflow()" :disabled="loading" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded font-medium disabled:opacity-50">
                    <span x-show="!loading">Run Workflow</span>
                    <span x-show="loading">Running...</span>
                </button>
            </div>
        </div>

        <div x-show="currentWorkflowId" class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8 shadow-md">
            <h2 class="text-xl font-bold mb-4">Workflow Status</h2>
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium" x-text="status.toUpperCase()"></span>
                <span class="text-sm text-gray-400" x-text="progress + '%'"></span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2.5 mb-4">
                <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" :style="'width: ' + progress + '%'"></div>
            </div>
            <div class="text-sm text-gray-400 font-mono h-32 overflow-y-auto bg-gray-900 p-3 rounded border border-gray-700 flex flex-col-reverse">
                <template x-for="log in logs">
                    <div x-text="log"></div>
                </template>
            </div>
        </div>

        <div x-show="records.length > 0" class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-md">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">Results (<span x-text="records.length"></span>)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-900 text-gray-400 border-b border-gray-700">
                        <tr>
                            <template x-for="col in columns">
                                <th class="p-3 font-medium" x-text="col"></th>
                            </template>
                            <th class="p-3 font-medium">Confidence</th>
                            <th class="p-3 font-medium">Sources</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="rec in records">
                            <tr class="border-b border-gray-700 hover:bg-gray-700/50 cursor-pointer" @click="inspect(rec)">
                                <template x-for="col in columns">
                                    <td class="p-3 truncate max-w-xs" x-text="rec.data[col] || '-'"></td>
                                </template>
                                <td class="p-3">
                                    <span class="px-2 py-1 text-xs rounded" :class="rec.confidence >= 0.8 ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'" x-text="(rec.confidence * 100).toFixed(0) + '%'"></span>
                                </td>
                                <td class="p-3 text-indigo-400 underline">View</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <div x-show="inspectedRecord" class="fixed inset-0 bg-black/50 z-50 flex justify-end" @click="inspectedRecord = null" style="display: none;">
            <div class="w-full max-w-lg bg-gray-800 h-full p-6 border-l border-gray-700 overflow-y-auto" @click.stop>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Record Details</h3>
                    <button @click="inspectedRecord = null" class="text-gray-400 hover:text-white">&times;</button>
                </div>
                <template x-if="inspectedRecord">
                    <div>
                        <div class="mb-6 space-y-4">
                            <template x-for="(val, key) in inspectedRecord.data">
                                <div>
                                    <div class="text-xs text-gray-400 uppercase tracking-wider" x-text="key"></div>
                                    <div class="text-sm font-medium whitespace-pre-wrap" x-text="val || '-'"></div>
                                </div>
                            </template>
                        </div>
                        <h4 class="font-bold border-b border-gray-700 pb-2 mb-4">Sources & Evidence</h4>
                        <template x-for="src in inspectedSources">
                            <div class="mb-4 bg-gray-900 p-4 rounded border border-gray-700 text-sm">
                                <a :href="src.url" target="_blank" class="text-indigo-400 hover:underline block mb-2 break-all" x-text="src.url"></a>
                                <div class="text-xs text-gray-500 mb-2">Fetched: <span x-text="new Date(src.fetched_at).toLocaleString()"></span></div>
                                <div class="bg-gray-800 p-2 border-l-2 border-indigo-500 text-gray-300 italic" x-text="src.evidence_snippet || 'No evidence extracted'"></div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
